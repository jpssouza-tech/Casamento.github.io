<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Especial • Emilly</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow-x: hidden;
    }

    h1, h2, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Animação suave de entrada dos cartões */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-step {
      animation: fadeSlideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Brilho decorativo sutil no fundo */
    .bg-glow {
      background:
        radial-gradient(circle at 15% 15%, rgba(236, 72, 153, 0.22), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(147, 51, 234, 0.25), transparent 50%),
        radial-gradient(circle at 50% 90%, rgba(30, 27, 75, 0.9), #0f172a 75%);
    }

    /* Efeito de toque nos botões */
    .btn-tap {
      transition: transform 0.16s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .btn-tap:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="bg-glow min-h-screen flex flex-col justify-between items-center px-4 py-6 sm:py-10 selection:bg-pink-500 selection:text-white">

  <!-- Cabeçalho discreto com barra de progresso -->
  <header class="w-full max-w-md flex flex-col gap-3 z-10">
    <div class="flex items-center justify-between text-xs text-slate-300/80 px-1">
      <button
        id="btn-back"
        type="button"
        onclick="goBack()"
        class="invisible inline-flex items-center gap-1.5 py-1.5 px-3 rounded-full bg-white/5 hover:bg-white/10 text-pink-200 font-medium transition focus:outline-none focus:ring-2 focus:ring-pink-400/50"
        aria-label="Voltar para a etapa anterior"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Voltar
      </button>

      <span id="step-indicator" class="font-medium tracking-wide text-purple-200/80">
        Etapa 1
      </span>
    </div>

    <!-- Barra de progresso -->
    <div class="w-full h-1.5 bg-slate-800/90 rounded-full overflow-hidden p-[1px]">
      <div
        id="progress-bar"
        class="h-full rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-400 transition-all duration-500 ease-out"
        style="width: 14%;"
      ></div>
    </div>
  </header>

  <!-- Container Principal (Cartão Interativo) -->
  <main class="w-full max-w-md my-auto py-6 z-10">
    <div
      id="card-container"
      class="w-full rounded-3xl bg-slate-900/75 backdrop-blur-xl border border-purple-500/25 shadow-[0_20px_60px_-15px_rgba(147,51,234,0.35)] p-6 sm:p-8"
    >
      <!-- Conteúdo dinâmico injetado via JS -->
      <div id="step-content" class="animate-step"></div>
    </div>
  </main>

  <!-- Rodapé sutil -->
  <footer class="w-full max-w-md text-center text-xs text-slate-400/70 z-10">
    Feito especialmente para você ✨
  </footer>

  <script>
    // Estado da aplicação armazenando as escolhas e o histórico de navegação
    const state = {
      currentStep: 'welcome',
      history: [],
      choices: {
        accepted: '',
        date: '',
        activity: '',
        time: ''
      }
    };

    // Número do WhatsApp de destino
    const WHATSAPP_NUMBER = '5511993998332';

    // Elementos do DOM
    const stepContentEl = document.getElementById('step-content');
    const btnBackEl = document.getElementById('btn-back');
    const progressBarEl = document.getElementById('progress-bar');
    const stepIndicatorEl = document.getElementById('step-indicator');

    /**
     * Calcula a porcentagem de progresso de acordo com o fluxo atual
     */
    function getProgressInfo(step) {
      const hasMovie = state.choices.activity === 'Cinema assistir Hexed';
      const flow = hasMovie
        ? ['welcome', 'accept', 'date', 'activity', 'movieInfo', 'time', 'restaurant', 'summary']
        : ['welcome', 'accept', 'date', 'activity', 'time', 'restaurant', 'summary'];

      const index = flow.indexOf(step);
      const current = index >= 0 ? index + 1 : 1;
      const total = flow.length;
      const percent = Math.round((current / total) * 100);

      return { current, total, percent };
    }

    /**
     * Navega para uma nova etapa e salva a anterior no histórico
     */
    function goToStep(nextStep) {
      if (state.currentStep !== nextStep) {
        state.history.push(state.currentStep);
        state.currentStep = nextStep;
        renderStep();
      }
    }

    /**
     * Volta para a etapa anterior no histórico
     */
    function goBack() {
      if (state.history.length > 0) {
        state.currentStep = state.history.pop();
        renderStep();
      }
    }

    /**
     * Registra uma escolha e avança para o próximo passo
     */
    function selectOption(field, value, nextStep) {
      state.choices[field] = value;
      goToStep(nextStep);
    }

    /**
     * Gera o link do WhatsApp com todas as escolhas formatadas
     */
    function buildWhatsAppUrl() {
      const { accepted, date, activity, time } = state.choices;
      const message = [
        `Oi! Aceitei o convite (${accepted}) ✨`,
        ``,
        `📅 *Sábado escolhido:* ${date}`,
        `🎯 *Rolê:* ${activity}`,
        `🚉 *Horário no trem Santo Amaro:* ${time}`,
        `🍽️ *Almoço:* Restaurante América`,
        `⛪ *18h:* Culto`
      ].join('\n');

      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    /**
     * Renderiza o conteúdo HTML da etapa atual com animação
     */
    function renderStep() {
      const { current, total, percent } = getProgressInfo(state.currentStep);

      // Atualiza barra de progresso e indicador
      progressBarEl.style.width = `${percent}%`;
      stepIndicatorEl.textContent = `Passo ${current} de ${total}`;

      // Controla visibilidade do botão Voltar
      if (state.history.length > 0) {
        btnBackEl.classList.remove('invisible');
      } else {
        btnBackEl.classList.add('invisible');
      }

      // Reinicia animação do container
      stepContentEl.classList.remove('animate-step');
      void stepContentEl.offsetWidth; // força reflow
      stepContentEl.classList.add('animate-step');

      switch (state.currentStep) {
        case 'welcome':
          stepContentEl.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-pink-500/20 to-purple-600/30 border border-pink-400/30 flex items-center justify-center mb-6 shadow-inner">
                <span class="text-3xl" role="img" aria-label="Brilhos">🎀</span>
              </div>

              <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-pink-500/15 text-pink-300 border border-pink-500/25 mb-4">
                Convite Especial
              </span>

              <h1 class="text-2xl sm:text-3xl font-extrabold text-white leading-snug mb-6">
                Oi Emilly, esse site é um convite para a gente passar um tempo juntos antes do culto
              </h1>

              <button
                type="button"
                onclick="goToStep('accept')"
                class="btn-tap w-full py-4 px-6 rounded-2xl font-bold text-base text-white bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-400 hover:to-purple-500 shadow-lg shadow-pink-500/25 focus:outline-none focus:ring-2 focus:ring-pink-400"
              >
                Continuar →
              </button>
            </div>
          `;
          break;

        case 'accept':
          stepContentEl.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-14 h-14 rounded-2xl bg-purple-500/20 border border-purple-400/30 flex items-center justify-center mb-5">
                <span class="text-2xl" role="img" aria-label="Coração">💜</span>
              </div>

              <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">
                Vc aceitas?
              </h2>
              <p class="text-sm text-slate-300/80 mb-7">
                Escolha uma das opções abaixo para continuar
              </p>

              <div class="w-full flex flex-col gap-3.5">
                <button
                  type="button"
                  onclick="selectOption('accepted', 'Sim', 'date')"
                  class="btn-tap w-full py-4 px-6 rounded-2xl font-bold text-base text-white bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 shadow-lg shadow-pink-500/20"
                >
                  Sim
                </button>

                <button
                  type="button"
                  onclick="selectOption('accepted', 'Com certeza', 'date')"
                  class="btn-tap w-full py-4 px-6 rounded-2xl font-bold text-base text-pink-100 bg-indigo-950/90 hover:bg-purple-900/60 border border-pink-400/35 shadow-md"
                >
                  Com certeza ✨
                </button>
              </div>
            </div>
          `;
          break;

        case 'date':
          stepContentEl.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-14 h-14 rounded-2xl bg-pink-500/20 border border-pink-400/30 flex items-center justify-center mb-5">
                <span class="text-2xl" role="img" aria-label="Calendário">📅</span>
              </div>

              <h2 class="text-xl sm:text-2xl font-extrabold text-white leading-snug mb-7">
                Q bom que vc escolheu por livre e espontânea vontade, preciso saber qual sábado vc prefere?
              </h2>

              <div class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <button
                  type="button"
                  onclick="selectOption('date', '28/11', 'activity')"
                  class="btn-tap py-4 px-6 rounded-2xl font-bold text-lg text-white bg-gradient-to-br from-pink-500/90 to-purple-700/90 hover:from-pink-500 hover:to-purple-600 border border-pink-300/30 shadow-lg shadow-purple-900/40"
                >
                  28/11
                </button>

                <button
                  type="button"
                  onclick="selectOption('date', '03/12', 'activity')"
                  class="btn-tap py-4 px-6 rounded-2xl font-bold text-lg text-white bg-gradient-to-br from-purple-600/90 to-indigo-800/90 hover:from-purple-500 hover:to-indigo-700 border border-purple-300/30 shadow-lg shadow-indigo-950/50"
                >
                  03/12
                </button>
              </div>
            </div>
          `;
          break;

        case 'activity':
          stepContentEl.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-14 h-14 rounded-2xl bg-indigo-500/20 border border-indigo-400/30 flex items-center justify-center mb-5">
                <span class="text-2xl" role="img" aria-label="Estrela">🌟</span>
              </div>

              <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">
                Oq vc quer fazer?
              </h2>
              <p class="text-sm text-slate-300/80 mb-7">
                Sábado dia <span class="text-pink-300 font-semibold">${state.choices.date}</span>
              </p>

              <div class="w-full flex flex-col gap-3.5">
                <button
                  type="button"
                  onclick="selectOption('activity', 'Parque Villa Lobos', 'time')"
                  class="btn-tap w-full p-4 rounded-2xl text-left flex items-center gap-4 bg-slate-800/80 hover:bg-purple-900/40 border border-purple-400/30 transition"
                >
                  <span class="w-12 h-12 rounded-xl bg-pink-500/20 flex items-center justify-center text-2xl shrink-0">
                    🌳
                  </span>
                  <div>
                    <div class="font-bold text-base text-white">Parque Villa Lobos</div>
                    <div class="text-xs text-slate-300/80">Passeio ao ar livre e tranquilo</div>
                  </div>
                </button>

                <button
                  type="button"
                  onclick="selectOption('activity', 'Cinema assistir Hexed', 'movieInfo')"
                  class="btn-tap w-full p-4 rounded-2xl text-left flex items-center gap-4 bg-slate-800/80 hover:bg-pink-900/35 border border-pink-400/35 transition"
                >
                  <span class="w-12 h-12 rounded-xl bg-purple-500/25 flex items-center justify-center text-2xl shrink-0">
                    🎬
                  </span>
                  <div>
                    <div class="font-bold text-base text-white">Cinema assistir Hexed</div>
                    <div class="text-xs text-pink-200/85">Ver detalhes do filme →</div>
                  </div>
                </button>
              </div>
            </div>
          `;
          break;

        case 'movieInfo':
          stepContentEl.innerHTML = `
            <div class="flex flex-col">
              <div class="flex items-center gap-3 mb-4">
                <span class="w-11 h-11 rounded-xl bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center text-xl shadow-md">
                  🎬
                </span>
                <div>
                  <span class="text-xs font-semibold uppercase tracking-wider text-pink-300">
                    Sinopse do Filme
                  </span>
                  <h2 class="text-2xl font-extrabold text-white">
                    Hexed
                  </h2>
                </div>
              </div>

              <div class="rounded-2xl bg-indigo-950/70 border border-purple-400/25 p-4 sm:p-5 mb-6">
                <p class="text-sm sm:text-base text-slate-200 leading-relaxed">
                  A trama acompanha Billie Doe, uma adolescente impulsiva, desajeitada e considerada "estranha" que tenta entender por que não se encaixa. A vida dela muda por completo quando ela desperta poderes mágicos latentes — um segredo que sua mãe, Alice Doe, tentou esconder por muito tempo para protegê-la.
                </p>
              </div>

              <button
                type="button"
                onclick="goToStep('time')"
                class="btn-tap w-full py-4 px-6 rounded-2xl font-bold text-base text-white bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-400 hover:to-purple-500 shadow-lg shadow-purple-600/25"
              >
                Escolher horário →
              </button>
            </div>
          `;
          break;

        case 'time':
          stepContentEl.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-14 h-14 rounded-2xl bg-purple-500/20 border border-purple-400/30 flex items-center justify-center mb-5">
                <span class="text-2xl" role="img" aria-label="Trem">🚉</span>
              </div>

              <h2 class="text-xl sm:text-2xl font-extrabold text-white leading-snug mb-2">
                Horário do encontro no trem Santo amaro
              </h2>
              <p class="text-sm text-slate-300/80 mb-6">
                Qual horário fica melhor para você?
              </p>

              <div class="w-full grid grid-cols-2 gap-3.5">
                ${['10h', '11h', '12h', '13h']
                  .map(
                    (hour) => `
                    <button
                      type="button"
                      onclick="selectOption('time', '${hour}', 'restaurant')"
                      class="btn-tap py-4 px-5 rounded-2xl font-bold text-lg text-white bg-slate-800/85 hover:bg-gradient-to-r hover:from-pink-500 hover:to-purple-600 border border-purple-400/30 shadow-md transition"
                    >
                      ${hour}
                    </button>
                  `
                  )
                  .join('')}
              </div>
            </div>
          `;
          break;

        case 'restaurant':
          stepContentEl.innerHTML = `
            <div class="flex flex-col items-center text-center">
              <div class="w-14 h-14 rounded-2xl bg-pink-500/20 border border-pink-400/30 flex items-center justify-center mb-5">
                <span class="text-2xl" role="img" aria-label="Restaurante">🍽️</span>
              </div>

              <h2 class="text-xl sm:text-2xl font-extrabold text-white leading-snug mb-3">
                Informações do restaurante q vamos comer
              </h2>

              <div class="w-full rounded-2xl bg-indigo-950/75 border border-pink-400/25 p-5 my-4">
                <p class="text-xs uppercase tracking-wider font-semibold text-pink-300 mb-1">
                  Local escolhido
                </p>
                <h3 class="text-xl font-bold text-white mb-4">
                  Restaurante América
                </h3>

                <a
                  href="https://maps.app.goo.gl/itYUcCh8tvpJAD4z7"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="btn-tap inline-flex items-center justify-center gap-2 w-full py-3.5 px-4 rounded-xl font-semibold text-sm text-pink-100 bg-purple-600/40 hover:bg-purple-600/60 border border-purple-400/40 transition"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-pink-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  Abrir localização no Google Maps
                </a>
              </div>

              <button
                type="button"
                onclick="goToStep('summary')"
                class="btn-tap w-full mt-2 py-4 px-6 rounded-2xl font-bold text-base text-white bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-400 hover:to-purple-500 shadow-lg shadow-pink-500/25"
              >
                Ver resumo final →
              </button>
            </div>
          `;
          break;

        case 'summary':
          const whatsappHref = buildWhatsAppUrl();
          stepContentEl.innerHTML = `
            <div class="flex flex-col">
              <div class="text-center mb-5">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-pink-500/25 to-purple-600/30 border border-pink-400/35 flex items-center justify-center mb-4">
                  <span class="text-2xl" role="img" aria-label="Comemoração">🎉</span>
                </div>

                <h2 class="text-xl sm:text-2xl font-extrabold text-white leading-snug">
                  Está marcado, me mande as respostas no Whatsapp
                </h2>
              </div>

              <!-- Cartão de resumo das escolhas -->
              <div class="rounded-2xl bg-slate-950/70 border border-purple-500/30 p-4 sm:p-5 space-y-3 mb-6 text-sm">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <span class="text-slate-400">📅 Data</span>
                  <span class="font-bold text-pink-300">Sábado, ${state.choices.date}</span>
                </div>

                <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <span class="text-slate-400">🚉 Horário escolhido</span>
                  <span class="font-bold text-white">${state.choices.time} (Trem Santo Amaro)</span>
                </div>

                <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <span class="text-slate-400">🎯 Rolê</span>
                  <span class="font-bold text-purple-200 text-right">${state.choices.activity}</span>
                </div>

                <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <span class="text-slate-400">🍽️ Restaurante</span>
                  <span class="font-bold text-white">Restaurante América</span>
                </div>

                <div class="flex items-center justify-between pt-0.5">
                  <span class="text-slate-400">⛪ Depois</span>
                  <span class="font-bold text-pink-200">18h - culto</span>
                </div>
              </div>

              <!-- Botão direto para o WhatsApp -->
              <a
                href="${whatsappHref}"
                target="_blank"
                rel="noopener noreferrer"
                class="btn-tap w-full py-4 px-6 rounded-2xl font-bold text-base text-white bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2.5 text-center"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                  <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/>
                </svg>
                Enviar respostas no WhatsApp
              </a>
            </div>
          `;
          break;
      }
    }

    // Inicializa a primeira tela ao carregar
    renderStep();
  </script>
</body>
</html>
```
