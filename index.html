<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Um convite especial pra você</title>
  <style>
    :root {
      --bg-dark: #070b19;
      --bg-mid: #160d2b;
      --card-bg: rgba(18, 22, 48, 0.78);
      --card-border: rgba(244, 114, 182, 0.28);
      --pink: #f472b6;
      --pink-soft: #fbcfe8;
      --purple: #a855f7;
      --navy: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(244, 114, 182, 0.22), transparent 42%),
        radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.24), transparent 45%),
        linear-gradient(155deg, var(--bg-dark) 0%, var(--bg-mid) 52%, #091126 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .progress-wrap {
      margin-bottom: 22px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--pink-soft);
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 12.5%;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .step {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .step.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(244, 114, 182, 0.16);
      border: 1px solid rgba(244, 114, 182, 0.35);
      color: var(--pink-soft);
      margin-bottom: 14px;
    }

    h1, h2 {
      font-size: 24px;
      line-height: 1.28;
      margin-bottom: 12px;
      color: #ffffff;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    .options.two-col {
      grid-template-columns: repeat(2, 1fr);
    }

    button.choice, a.btn-link {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(244, 114, 182, 0.32);
