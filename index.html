<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite Especial • Emilly</title>
  <style>
    /* Reset e Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink-light: #f472b6;
      --pink-main: #ec4899;
      --purple-light: #a855f7;
      --purple-dark: #7e22ce;
      --blue-deep: #0f172a;
      --blue-indigo: #1e1b4b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --glass-bg: rgba(15, 23, 42, 0.78);
      --glass-border: rgba(168, 85, 247, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--blue-deep);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(236, 72, 153, 0.28), transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(168, 85, 247, 0.3), transparent 50%),
        radial-gradient(circle at 50% 95%, rgba(30, 27, 75, 0.96), var(--blue-deep) 80%);
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Cabeçalho e Barra de Progresso */
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
      padding: 0 4px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fbcfe8;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-back:active {
      transform: scale(0.96);
    }

    .btn-back.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .step-label {
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #e9d5ff;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 9999px;
      overflow: hidden;
      padding: 1px;
    }

    .progress-fill {
      height: 100%;
      width: 14%;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--pink-main), var(--purple-light), #6366f1);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Cartão Principal Glassmorphism */
    .main-wrapper {
      width: 100%;
      max-width: 440px;
      margin: auto 0;
      padding: 16px 0;
      z-index: 10;
    }

    .glass-card {
      width: 100%;
      border-radius: 28px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 24px 60px -15px rgba(126, 34, 206, 0.45);
      padding: 28px 24px;
    }

    @media (min-width: 480px) {
      .glass-card {
        padding: 36px 32px;
      }
    }

    /* Animação Suave entre Etapas */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .step-animate {
      animation: fadeSlideUp 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Tipografia e Componentes */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .icon-badge {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.22), rgba(126, 34, 206, 0.34));
      border: 1px solid rgba(244, 114, 182, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .pill-tag {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(236, 72, 153, 0.16);
      color: #f9a8d4;
      border: 1px solid rgba(236, 72, 153, 0.3);
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.42rem;
      font-weight: 800;
      line-height: 1.32;
      color: #ffffff;
      margin-bottom: 12px;
    }

    @media (min-width: 480px) {
      .title {
        font-size: 1.6rem;
      }
    }

    .subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .highlight-pink {
      color: #f9a8d4;
      font-weight: 700;
    }

    /* Botões */
    .btn-primary {
      width: 100%;
      padding: 16px 22px;
      border: none;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--pink-main), var(--purple-dark));
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.42);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      box-shadow: 0 14px 30px -5px rgba(236, 72, 153, 0.52);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      width: 100%;
      padding: 16px 22px;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 700;
      color: #fce7f3;
      background: rgba(30, 27, 75, 0.85);
      border: 1px solid rgba(244, 114, 182, 0.35);
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(126, 34, 206, 0.4);
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    .stack-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid-2 {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .btn-grid {
      padding: 16px 12px;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.34);
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn-grid:hover {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.85), rgba(126, 34, 206, 0.9));
      border-color: rgba(244, 114, 182, 0.65);
    }

    .btn-grid:active {
      transform: scale(0.97);
    }

    /* Cartões de Opção de Atividade */
    .option-card {
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      background: rgba(30, 41, 59, 0.78);
      border: 1px solid rgba(168, 85, 247, 0.32);
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .option-card:hover {
      background: rgba(126, 34, 206, 0.34);
      border-color: rgba(244, 114, 182, 0.58);
    }

    .option-card:active {
      transform: scale(0.98);
    }

    .option-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(236, 72, 153, 0.18);
      border: 1px solid rgba(244, 114, 182, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-title {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .option-desc {
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    /* Caixa de Sinopse e Restaurante */
    .info-box {
      width: 100%;
      border-radius: 20px;
      background: rgba(30, 27, 75, 0.78);
      border: 1px solid rgba(168, 85, 247, 0.32);
      padding: 18px;
      margin-bottom: 22px;
      text-align: left;
    }

    .info-box p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 16px;
      margin-top: 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #fce7f3;
      background: rgba(168, 85, 247, 0.28);
      border: 1px solid rgba(244, 114, 182, 0.42);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn-map:hover {
      background: rgba(168, 85, 247, 0.46);
    }

    .btn-map:active {
      transform: scale(0.98);
    }

    /* Cartão de Resumo Final */
    .summary-list {
      width: 100%;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(168, 85, 247, 0.34);
      padding: 16px 18px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 0.88rem;
    }

    .summary-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .summary-key {
      color: #94a3b8;
      flex-shrink: 0;
    }

    .summary-val {
      color: #f8fafc;
      font-weight: 700;
      text-align: right;
    }

    .summary-val.accent {
      color: #f9a8d4;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.42);
      transition: transform 0.16s ease, filter 0.2s ease;
    }

    .btn-whatsapp:hover {
      filter: brightness(1.07);
    }

    .btn-whatsapp:active {
      transform: scale(0.97);
    }

    .btn-restart {
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .btn-restart:hover {
      color: #fbcfe8;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Rodapé */
    .footer {
      width: 100%;
      max-width: 440px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(203, 213, 225, 0.65);
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho com botão voltar e barra de progresso -->
  <header class="header">
    <div class="header-top">
      <button id="btn-back" type="button" class="btn-back hidden" onclick="goBack()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Voltar
      </button>
      <span id="step-indicator" class="step-label">Etapa 1</span>
    </div>
    <div class="progress-track">
      <div id="progress-bar" class="progress-fill"></div>
    </div>
  </header>

  <!-- Cartão Principal -->
  <main class="main-wrapper">
    <section class="glass-card">
      <div id="step-content" class="step-animate"></div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    Feito especialmente para você
  </footer>

  <script>
    // Estado central da aplicação multi-step
    const state = {
      currentStep: 'welcome',
      history: [],
      choices: {
        accepted: '',
        date: '',
        activity: '',
        time: ''
      }
    };

    const WHATSAPP_NUMBER = '5511993998332';

    const stepContentEl = document.getElementById('step-content');
    const btnBackEl = document.getElementById('btn-back');
    const progressBarEl = document.getElementById('progress-bar');
    const stepIndicatorEl = document.getElementById('step-indicator');

    // Ícones SVG inline
    const icons = {
      sparkle: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>',
      heart: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      calendar: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
      compass: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
      tree: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L4 15h16L12 3z"/><line x1="12" y1="15" x2="12" y2="21"/></svg>',
      film: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>',
      clock: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      utensils: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
      pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      check: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      whatsapp: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/></svg>'
    };

    function getProgress(step) {
      const hasCinema = state.choices.activity === 'Cinema no Shopping Villa-Lobos - Hexed';
      const flow = hasCinema
        ? ['welcome', 'accept', 'date', 'activity', 'movieInfo', 'time', 'restaurant', 'summary']
        : ['welcome', 'accept', 'date', 'activity', 'time', 'restaurant', 'summary'];

      const idx = flow.indexOf(step);
      const current = idx >= 0 ? idx + 1 : 1;
      const total = flow.length;
      const percent = Math.round((current / total) * 100);
      return { current, total, percent };
    }

    function goToStep(nextStep) {
      state.history.push(state.currentStep);
      state.currentStep = nextStep;
      renderStep();
    }

    function selectOption(field, value, nextStep) {
      state.choices[field] = value;
      goToStep(nextStep);
    }

    function goBack() {
      if (state.history.length === 0) return;
      state.currentStep = state.history.pop();
      renderStep();
    }

    function restartInvite() {
      state.currentStep = 'welcome';
      state.history = [];
      state.choices = { accepted: '', date: '', activity: '', time: '' };
      renderStep();
    }

    function buildWhatsAppUrl() {
      const { accepted, date, activity, time } = state.choices;
      const text = [
        'Oi! Respondi o convite (' + accepted + ')',
        '',
        'Data escolhida: ' + date,
        'Atividade: ' + activity,
        'Horário no trem Santo Amaro: ' + time,
        'Restaurante: Restaurante América',
        '18h - Culto'
      ].join('\n');

      return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(text);
    }

    function renderStep() {
      if (state.history.length > 0) {
        btnBackEl.classList.remove('hidden');
      } else {
        btnBackEl.classList.add('hidden');
      }

      const { current, total, percent } = getProgress(state.currentStep);
      progressBarEl.style.width = percent + '%';
      stepIndicatorEl.textContent = 'Etapa ' + current + ' de ' + total;

      stepContentEl.classList.remove('step-animate');
      void stepContentEl.offsetWidth;
      stepContentEl.classList.add('step-animate');

      switch (state.currentStep) {
        case 'welcome':
          stepContentEl.innerHTML = `
            <div class="center-col">
              <div class="icon-badge">${icons.sparkle}</div>
              <span class="pill-tag">Convite Especial</span>
              <h1 class="title">
                Oi Emilly, esse site é um convite para a gente passar um tempo juntos antes do culto
              </h1>
              <p class="subtitle">
                Preparei algumas opções para você escolher como prefere o nosso sábado.
              </p>
              <button type="button" class="btn-primary" onclick="goToStep('accept')">
                Continuar
              </button>
            </div>
          `;
          break;

        case 'accept':
          stepContentEl.innerHTML = `
            <div class="center-col">
              <div class="icon-badge">${icons.heart}</div>
              <h2 class="title">Você aceita?</h2>
              <p class="subtitle">Escolha uma das opções abaixo:</p>
              <div class="stack-buttons">
                <button type="button" class="btn-primary" onclick="selectOption('accepted', 'Bora!', 'date')">
                  Bora!
